spring.application.name=compass-backend

# SQLite (file created next to where the app is started; override with COMPASS_DB_PATH)
spring.datasource.url=jdbc:sqlite:${COMPASS_DB_PATH:compass.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer, so one pooled connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update only adds missing tables/columns (SQLite cannot alter or drop them)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

llm.enabled=${LLM_ENABLED:false}
llm.base-url=https://openrouter.ai/api/v1
llm.api-key=${OPENROUTER_API_KEY}
llm.model=${OPENROUTER_MODEL}

# Authentication
# Secret that signs the access tokens (at least 32 characters). Set it in every real environment.
compass.jwt.secret=${COMPASS_JWT_SECRET:}
compass.jwt.ttl=${COMPASS_JWT_TTL:PT2H}
# Web page origins allowed to call the API from a browser (comma separated)
compass.cors.allowed-origins=${COMPASS_CORS_ORIGINS:http://localhost:5173}
